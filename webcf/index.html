<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebCF - 网页版穿越火线</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 游戏容器 -->
    <div id="game-container">
        <!-- 加载界面 -->
        <div id="loading-screen">
            <h1>WebCF</h1>
            <p>正在加载资源...</p>
            <div class="progress-bar">
                <div id="loading-progress"></div>
            </div>
        </div>

        <!-- 主菜单 -->
        <div id="main-menu" class="hidden">
            <h1>WebCF</h1>
            <button id="start-btn">开始游戏</button>
            <button id="controls-btn">操作说明</button>
        </div>

        <!-- 游戏UI -->
        <div id="game-ui" class="hidden">
            <!-- 准星 -->
            <div id="crosshair">
                <div class="crosshair-line horizontal"></div>
                <div class="crosshair-line vertical"></div>
            </div>

            <!-- 信息面板 -->
            <div id="info-panel">
                <div class="info-item">
                    <span class="label">生命:</span>
                    <div class="health-bar">
                        <div id="health-fill"></div>
                    </div>
                    <span id="health-text">100</span>
                </div>
                <div class="info-item">
                    <span class="label">弹药:</span>
                    <span id="ammo-text">30/90</span>
                </div>
                <div class="info-item">
                    <span class="label">武器:</span>
                    <span id="weapon-name">AK-47</span>
                </div>
                <div class="info-item">
                    <span class="label">得分:</span>
                    <span id="score-text">0</span>
                </div>
                <div class="info-item">
                    <span class="label">波次:</span>
                    <span id="wave-text">1</span>
                </div>
            </div>

            <!-- 击杀提示 -->
            <div id="kill-feed"></div>

            <!-- 暂停菜单 -->
            <div id="pause-menu" class="hidden">
                <h2>游戏暂停</h2>
                <button id="resume-btn">继续游戏</button>
                <button id="restart-btn">重新开始</button>
                <button id="menu-btn">返回主菜单</button>
            </div>

            <!-- 游戏结束 -->
            <div id="game-over" class="hidden">
                <h2 id="game-over-title">游戏结束</h2>
                <p>最终得分: <span id="final-score">0</span></p>
                <button id="retry-btn">再来一局</button>
                <button id="go-menu-btn">返回主菜单</button>
            </div>
        </div>

        <!-- 操作说明 -->
        <div id="controls-modal" class="hidden">
            <div class="modal-content">
                <h2>操作说明</h2>
                <table>
                    <tr><td>W/A/S/D</td><td>移动</td></tr>
                    <tr><td>鼠标移动</td><td>控制视角</td></tr>
                    <tr><td>左键</td><td>射击</td></tr>
                    <tr><td>右键</td><td>瞄准</td></tr>
                    <tr><td>R</td><td>换弹</td></tr>
                    <tr><td>空格</td><td>跳跃</td></tr>
                    <tr><td>Shift</td><td>奔跑</td></tr>
                    <tr><td>1/2/3</td><td>切换武器</td></tr>
                    <tr><td>ESC</td><td>暂停</td></tr>
                </table>
                <button id="close-controls">关闭</button>
            </div>
        </div>
    </div>

    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/PointerLockControls.js"></script>
    
    <!-- 游戏脚本 -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
